version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: textbook_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: telemetry_dashboard
    ports:
      - "6006:6006"
    restart: always
